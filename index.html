<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soft Skills Quiz</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f9f9f9; padding: 20px; color: #333; }
  h1 { text-align: center; color: #0056b3; }
  .quiz-container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .question-block { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
  .question-text { font-weight: bold; margin-bottom: 10px; }
  .options { list-style: none; padding: 0; }
  .options li { margin-bottom: 5px; }
  .option-btn { width: 100%; text-align: left; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; transition: background 0.2s; }
  .option-btn:hover { background: #e9ecef; }
  .feedback { margin-top: 10px; font-weight: bold; display: none; padding: 10px; border-radius: 4px; }
  .feedback.show { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Soft Skills Comprehensive Quiz</h1>
  <div id="quiz"></div>
</div>

<script>
  // All 60 questions from Week 1 to Week 4
  const quizData = [
    // Week 1[span_12](start_span)[span_12](end_span)[span_13](start_span)[span_13](end_span)[span_14](start_span)[span_14](end_span)
    { q: "1. Hearing is a physiological activity, whereas listening is a[span_15](start_span)[span_15](end_span)", opts: ["a) mental", "b) physical", "c) social", "d) psychological"], ans: "a) mental (or d) psychological based on context)" },
    { q: "2. The system of personality that operates on the pleasure principle and represents the true psychic reality is the[span_16](start_span)[span_16](end_span)", opts: ["a) ego", "b) superego", "c) id", "d) creative self"], ans: "c) id" },
    { q: "3. In the six thinking hats technique, the hat associated with generating ideas is the[span_17](start_span)[span_17](end_span)", opts: ["a) white hat", "b) yellow hat", "c) green hat", "d) blue hat"], ans: "c) green hat" },
    { q: "4. The word 'personality' is derived from the Latin word persona, meaning[span_18](start_span)[span_18](end_span)", opts: ["a) mind", "b) mask", "c) mimesis", "d) personal"], ans: "b) mask" },
    { q: "5. The shared background of experience between a sender and a receiver, essential for successful communication, is called the:[span_19](start_span)[span_19](end_span)", opts: ["a) common frame of reference", "b) feedback loop", "c) communication channel", "d) grapevine"], ans: "a) common frame of reference" },
    { q: "6. A recruiter would rather hire a candidate with a pleasant smile and good communication skills than one who has:[span_20](start_span)[span_20](end_span)", opts: ["a) a foreign degree", "b) a very good CGPA but is doing nothing", "c) several years of work experience", "d) strong technical certifications"], ans: "b) a very good CGPA but is doing nothing" },
    { q: "7. The word 'communication' derives from the Latin word communicare, which means:[span_21](start_span)[span_21](end_span)", opts: ["a) To speak", "b) To share", "c) To inform", "d) To persuade"], ans: "b) To share" },
    { q: "8. 'Grapevine' in organizational communication refers to:[span_22](start_span)[span_22](end_span)", opts: ["a) A formal upward channel of communication", "b) An informal channel that may be rumor-based and not always authentic", "c) External communication with government agencies", "d) Communication through company websites and pamphlets"], ans: "b) An informal channel that may be rumor-based and not always authentic" },
    { q: "9. Approximately what percentage of one's time (in any job) is spent in listening?[span_23](start_span)[span_23](end_span)", opts: ["a) 30-40 percent", "b) 40-50 percent", "c) 60-75 percent", "d) 80-90 percent"], ans: "b) 40-50 percent" },
    { q: "10. Extracting meaning from a received message (receiver's task) is:[span_24](start_span)[span_24](end_span)", opts: ["a) Code", "b) Interpreting", "c) Encode", "d) Decode"], ans: "d) Decode" },
    { q: "11. Which of the following are behavioural soft skills? (Select all that apply)[span_25](start_span)[span_25](end_span)", opts: ["a) Self-awareness", "b) Technical competence", "c) Persistence", "d) Knowledge"], ans: "a) Self-awareness, c) Persistence" },
    { q: "12. Which of the following are part of the Seven Cs of effective communication? (Select all that apply)[span_26](start_span)[span_26](end_span)", opts: ["a) Crispness", "b) Conciseness", "c) Creativity", "d) Courtesy"], ans: "b) Conciseness, d) Courtesy" },
    { q: "13. According to De Bono's Six Thinking Hats technique, which of the following hat function pairings are correct? (Select all that apply)[span_27](start_span)[span_27](end_span)", opts: ["a) White hat - seeing things objectively", "b) Red hat - generating ideas", "c) Yellow hat - fighting against and preventing mistakes", "d) Blue hat - organizing and controlling the thought process"], ans: "a) White hat - seeing things objectively, d) Blue hat - organizing and controlling the thought process" },
    { q: "14. Which of the following statements about Freud's theory of personality are correct? (Select all that apply)[span_28](start_span)[span_28](end_span)[span_29](start_span)[span_29](end_span)", opts: ["a) The Id operates through the Reality Principle", "b) The Ego is the executive of the personality and organized portion of the Id", "c) The Superego strives for perfection rather than pleasure", "d) The Superego opposes only the Id, but supports the Ego"], ans: "b) The Ego is the executive of the personality and organized portion of the Id, c) The Superego strives for perfection rather than pleasure" },
    { q: "15. Match the concept with the correct thinker/source:[span_30](start_span)[span_30](end_span)", opts: ["a) P-3, Q-1, R-2, S-4", "b) P-1, Q-3, R-4, S-2", "c) P-3, Q-1, R-4, S-2", "d) P-2, Q-1, R-3, S-4"], ans: "a) P-3, Q-1, R-2, S-4 (Swami Vivekananda - Arise, awake; Adler - Superiority; Freud - Id, Ego, Superego; Hume - Truth springs from argument)" },

    // Week 2[span_31](start_span)[span_31](end_span)[span_32](start_span)[span_32](end_span)[span_33](start_span)[span_33](end_span)
    { q: "1. In the glass-of-water example, a person who says the glass is 'half empty' is described as:[span_34](start_span)[span_34](end_span)", opts: ["a) An optimist", "b) A pessimist", "c) An introvert", "d) An extrovert"], ans: "b) A pessimist" },
    { q: "2. According to Dr. Eric Berne, the attitude 'I'm okay, you are okay' represents a person who is:[span_35](start_span)[span_35](end_span)", opts: ["a) Imposing", "b) Negative", "c) Positive and cooperative", "d) Introverted"], ans: "c) Positive and cooperative" },
    { q: "3. According to Mehrabian, the percentage of communication that is verbal is:[span_36](start_span)[span_36](end_span)", opts: ["a) 7%", "b) 35%", "c) 38%", "d) 55%"], ans: "a) 7%" },
    { q: "4. Which voice fault results from the inflammation of the larynx and usually needs a speech therapist?[span_37](start_span)[span_37](end_span)", opts: ["a) Throatiness", "b) Breathiness", "c) Nasalization", "d) Hoarseness"], ans: "d) Hoarseness" },
    { q: "5. In the Johari Window, the region representing information that is unknown by the person but known by others is the:[span_38](start_span)[span_38](end_span)", opts: ["a) Open area", "b) Blind area", "c) Hidden area", "d) Unknown area"], ans: "b) Blind area" },
    { q: "6. Which of the following is not listed as a feature of telephonic communication?[span_39](start_span)[span_39](end_span)", opts: ["a) Clarity", "b) Courtesy", "c) Brevity", "d) Confrontation"], ans: "d) Confrontation" },
    { q: "7. Teleconferencing is generally considered ineffective for which of the following purpose?[span_40](start_span)[span_40](end_span)", opts: ["a) Connecting geographically dispersed people", "b) Negotiations", "c) Arranging meetings at short notice", "d) Saving travel costs"], ans: "b) Negotiations" },
    { q: "8. The change in pitch produced by the vibration of the vocal cords is called[span_41](start_span)[span_41](end_span)", opts: ["a) Intonation", "b) Articulation", "c) Inflection", "d) Modulation"], ans: "c) Inflection" },
    { q: "9. Voice mail acts as a substitute to short memos and phone calls and helps solve ______ difficulties.[span_42](start_span)[span_42](end_span)", opts: ["a) Special zone", "b) Time zone", "c) Communication zone", "d) Talk zone"], ans: "b) Time zone" },
    { q: "10. Which two of the following are listed as ways to develop positivism? (Select all that apply)[span_43](start_span)[span_43](end_span)", opts: ["a) Believe in your abilities", "b) Imitate others completely", "c) Concentrate on your goals", "d) Hide your weaknesses permanently"], ans: "a) Believe in your abilities, c) Concentrate on your goals" },
    { q: "11. While sending a call, which two of the following guidelines should be followed? (Select all that apply)[span_44](start_span)[span_44](end_span)", opts: ["a) Recline in your chair", "b) Place your own call", "c) Plan an agenda", "d) Avoid identifying yourself"], ans: "b) Place your own call, c) Plan an agenda" },
    { q: "12. Which two statements about voice mail are correct? (Select all that apply)[span_45](start_span)[span_45](end_span)", opts: ["a) It provides immediate, specific feedback.", "b) It acts as a substitute to short memos and phone calls.", "c) It solves time-zone difficulties.", "d) It increases interoffice paperwork."], ans: "b) It acts as a substitute to short memos and phone calls., c) It solves time-zone difficulties." },
    { q: "13. Which of the following points highlight the importance of telephonic communication? (Select all that apply)[span_46](start_span)[span_46](end_span)[span_47](start_span)[span_47](end_span)", opts: ["a) Provides immediate face-to-face feedback", "b) Allows reading of facial expressions", "c) Bridges time and distance gaps", "d) Entails low cost"], ans: "c) Bridges time and distance gaps, d) Entails low cost" },
    { q: "14. Which two of the following are described as characteristics of voice? (Select all that apply)[span_48](start_span)[span_48](end_span)", opts: ["a) Volume", "b) Grammar", "c) Pitch", "d) Vocabulary"], ans: "a) Volume, c) Pitch" },
    { q: "15. Match the hand movement/gesture in Column A with the emotion or meaning it symbolises in Column B.[span_49](start_span)[span_49](end_span)", opts: ["a) 1→P, 2 R, 3→S, 4→Q", "b) 1→R, 2 P, 3 S, 4→Q", "c) 1→R, 2 S, 3→P, 4→Q", "d) 1→Q, 2 P, 3→R, 4→S"], ans: "b) 1→R, 2 P, 3 S, 4→Q" },

    // Week 3[span_50](start_span)[span_50](end_span)[span_51](start_span)[span_51](end_span)[span_52](start_span)[span_52](end_span)
    { q: "1. The term 'proxemics' is derived from which word?[span_53](start_span)[span_53](end_span)", opts: ["a) Property", "b) Proximity", "c) Procedure", "d) Proportion"], ans: "b) Proximity" },
    { q: "2. The word 'haptics' is taken from a Greek word that means:[span_54](start_span)[span_54](end_span)", opts: ["a) I see", "b) I hear", "c) I touch", "d) I feel"], ans: "c) I touch" },
    { q: "3. The prefix 'meta' means:[span_55](start_span)[span_55](end_span)", opts: ["a) Within", "b) Beyond", "c) Around", "d) Without"], ans: "b) Beyond" },
    { q: "4. The study of time in communication is called[span_56](start_span)[span_56](end_span)", opts: ["a) Communemics", "b) Chronemics", "c) Kinesics", "d) Mimesis"], ans: "b) Chronemics" },
    { q: "5. Hearing is only a _____ activity, whereas listening is a mental activity that requires conscious participation.[span_57](start_span)[span_57](end_span)", opts: ["a) Physiological", "b) Psychological", "c) Physical", "d) Social"], ans: "a) Physiological" },
    { q: "6. According to the Space Zone in Proxemics, the social zone corresponds to a space distance of:[span_58](start_span)[span_58](end_span)", opts: ["a) Up to 18 inches", "b) 18 inches to 4 feet", "c) 4 feet to 12 feet", "d) 12 feet to 30 feet"], ans: "c) 4 feet to 12 feet" },
    { q: "7. Listening in which the listener keeps protesting mentally instead of taking in the message is called:[span_59](start_span)[span_59](end_span)", opts: ["a) Attentive Listening", "b) Reflective Listening", "c) Combative Listening", "d) Appreciative Listening"], ans: "c) Combative Listening" },
    { q: "8. In Thailand and Laos, it is considered rude for a stranger to touch a child on the head because the head is regarded as:[span_60](start_span)[span_60](end_span)", opts: ["a) the most fragile part of the body", "b) the home of the spirit or soul", "c) a mark of seniority", "d) reserved only for parents"], ans: "b) the home of the spirit or soul" },
    { q: "9. 'Lying is done with words and also with silence.' This observation is attributed to:[span_61](start_span)[span_61](end_span)", opts: ["a) Edward T. Hall", "b) Ernest Hemingway", "c) Adrienne Rich", "d) Albert Mehrabian"], ans: "c) Adrienne Rich" },
    { q: "10. Which of the following countries are classified as high context cultures? (Select all that apply)[span_62](start_span)[span_62](end_span)", opts: ["a) Germany", "b) Japan", "c) England", "d) Arab"], ans: "b) Japan, d) Arab" },
    { q: "11. Which of the following are listed as internal factors that affect listening? (Select all that apply)[span_63](start_span)[span_63](end_span)", opts: ["a) Noise in the room", "b) State of mind", "c) Ego", "d) Choice of venue"], ans: "b) State of mind, c) Ego" },
    { q: "12. Which of the following are factors that block or deter proper listening? (Select all that apply)[span_64](start_span)[span_64](end_span)", opts: ["a) Patience", "b) Adequate hearing", "c) Prejudging", "d) Ambiguity"], ans: "c) Prejudging, d) Ambiguity" },
    { q: "13. Which two are stated advantages of silence in a speech? (Select all that apply)[span_65](start_span)[span_65](end_span)", opts: ["a) It relieves the audience", "b) It increases the speaker's rate of delivery", "c) It provides thinking time to the speaker", "d) It removes the need for preparation"], ans: "a) It relieves the audience, c) It provides thinking time to the speaker" },
    { q: "14. Excessive use of non-words and vocalized pauses by a speaker may convey: (Select all that apply)[span_66](start_span)[span_66](end_span)", opts: ["a) Ambiguity or doubt", "b) Authority", "c) Lack of preparation", "d) Command over the subject"], ans: "a) Ambiguity or doubt, c) Lack of preparation" },
    { q: "15. Match the type of listening in Column A with its situation in Column B, then choose the correct option.[span_67](start_span)[span_67](end_span)", opts: ["a) 1-P, 2-Q, 3-R, 4-S", "b) 1-Q, 2-P, 3-R, 4-S", "c) 1-Q, 2-P, 3-S, 4-R", "d) 1-R, 2-S, 3-Q, 4-P"], ans: "b) 1-Q, 2-P, 3-R, 4-S" },

    // Week 4[span_68](start_span)[span_68](end_span)[span_69](start_span)[span_69](end_span)[span_70](start_span)[span_70](end_span)
    { q: "1. What does the acronym WATNA stand for in negotiation?[span_71](start_span)[span_71](end_span)", opts: ["a) Worst Alternative to a Negotiated Agreement", "b) Wise Alternative to a Negotiated Agreement", "c) Worst Argument to a Negotiation Approach", "d) Workable Alternative to a New Agreement"], ans: "a) Worst Alternative to a Negotiated Agreement" },
    { q: "2. To which former US President is attributed the following line: 'Let us never negotiate out of fear, but let us never fear to negotiate[span_72](start_span)'[span_72](end_span)", opts: ["a) Abraham Lincoln", "b) John F. Kennedy", "c) Franklin D. Roosevelt", "d) Woodrow Wilson"], ans: "b) John F. Kennedy" },
    { q: "3. According to Alan Fowler, negotiation is any form of meeting or discussion in which the parties use argument and persuasion to arrive at:[span_73](start_span)[span_73](end_span)", opts: ["a) A unilateral decision favouring the stronger party", "b) An agreed decision or action", "c) A legally binding written contract", "d) A postponement of the conflict"], ans: "b) An agreed decision or action" },
    { q: "4. To which of the following does a real negotiation proceed through?[span_74](start_span)[span_74](end_span)", opts: ["a) Authority, not instruction", "b) Instruction and persuasion, not authority and imposition", "c) Imposition backed by seniority", "d) Silence and withdrawal"], ans: "b) Instruction and persuasion, not authority and imposition" },
    { q: "5. In Hong Kong, hospital rooms avoid the number four because the sound shi is a homophone for:[span_75](start_span)[span_75](end_span)", opts: ["a) Poverty", "b) Illness", "c) Death", "d) Bad luck in trade"], ans: "c) Death" },
    { q: "6. Alfred G. Smith, in Communication and Culture, defines culture as:[span_76](start_span)[span_76](end_span)", opts: ["a) A code we learn and share", "b) The sum of a nation's laws and religion", "c) An unchanging set of inherited traits", "d) The visible customs of a majority community"], ans: "a) A code we learn and share" },
    { q: "7. Which style, according to the colour-based classification of negotiation styles, is a mix of the competitive and the cooperative approaches and is recommended for negotiators?[span_77](start_span)[span_77](end_span)", opts: ["a) Red style", "b) Blue style", "c) Purple style", "d) Green style"], ans: "c) Purple style" },
    { q: "8. According to McGregor, the modern style of management is built on a balance between:[span_78](start_span)[span_78](end_span)", opts: ["a) Control and freedom", "b) Profit and loss", "c) Reward and punishment", "d) Authority and seniority"], ans: "a) Control and freedom" },
    { q: "9. ZOPA stands for the ______ of possible agreement, the space in which an agreement can be reached.[span_79](start_span)[span_79](end_span)", opts: ["a) area", "b) zone", "c) medium", "d) arena"], ans: "b) zone" },
    { q: "10. Which of the following are listed as qualities of a good negotiator? (Select all that apply)[span_80](start_span)[span_80](end_span)", opts: ["a) Confidence", "b) Rigidity", "c) Honesty", "d) Aggression"], ans: "a) Confidence, c) Honesty" },
    { q: "11. In a formal negotiation, which of the following are pre-announced beforehand to both parties? (Select all that apply)[span_81](start_span)[span_81](end_span)", opts: ["a) The personal relationship of the parties", "b) The agenda", "c) The fear factor involved", "d) The venue, date and time"], ans: "b) The agenda, d) The venue, date and time" },
    { q: "12. Which two are listed among the subjective factors that affect negotiation? (Select all that apply)[span_82](start_span)[span_82](end_span)", opts: ["a) The upper and lower limits of concession", "b) Personal relationship between the parties", "c) The fear factor", "d) The written summary of the agreement"], ans: "b) Personal relationship between the parties, c) The fear factor" },
    { q: "13. Which of the following peoples are described as belonging to the low-context culture? (Select all that apply)[span_83](start_span)[span_83](end_span)", opts: ["a) Japanese", "b) Arabs", "c) North Americans", "d) Germans"], ans: "c) North Americans, d) Germans" },
    { q: "14. According to Maslow's hierarchy, which of the following count as physiological (basic) needs? (Select all that apply)[span_84](start_span)[span_84](end_span)", opts: ["a) Food", "b) Creativity", "c) Morality", "d) Shelter"], ans: "a) Food, d) Shelter" },
    { q: "15. Match the culture/country with the practice described in the lectures.[span_85](start_span)[span_85](end_span)", opts: ["a) 1-R, 2-T, 3-P, 4-Q, 5-S", "b) 1-T, 2-R, 3-Q, 4-P, 5-S", "c) 1-P, 2-T, 3-R, 4-S, 5-Q", "d) 1-R, 2-P, 3-T, 4-S, 5-Q"], ans: "c) 1-P, 2-T, 3-R, 4-S, 5-Q" }
  ];

  const quizContainer = document.getElementById('quiz');

  quizData.forEach((item, index) => {
    // Create Question Block
    const qBlock = document.createElement('div');
    qBlock.className = 'question-block';
    
    // Add Question Text
    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.innerText = item.q;
    qBlock.appendChild(qText);
    
    // Add Options List
    const optionsList = document.createElement('ul');
    optionsList.className = 'options';
    
    // Add Feedback Element (Hidden initially)
    const feedback = document.createElement('div');
    feedback.className = 'feedback';
    feedback.innerText = "Correct Answer(s): " + item.ans;

    item.opts.forEach(opt => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => {
        // Show correct answer for this block when any option is selected
        feedback.classList.add('show');
      };
      li.appendChild(btn);
      optionsList.appendChild(li);
    });

    qBlock.appendChild(optionsList);
    qBlock.appendChild(feedback);
    quizContainer.appendChild(qBlock);
  });
</script>

</body>
</html>
