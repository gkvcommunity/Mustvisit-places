    ];

    const container = document.getElementById('quiz-container');

    // Render Quiz & Add Listeners for Instant Feedback
    quizData.forEach((item, index) => {
        const questionBlock = document.createElement('div');
        questionBlock.className = 'question-block';
        questionBlock.id = `qblock-${index}`;

        const questionText = document.createElement('div');
        questionText.className = 'question-text';
        questionText.innerText = item.q + (item.isMulti ? " (Multiple Select)" : "");
        questionBlock.appendChild(questionText);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options';

        for (const [key, value] of Object.entries(item.options)) {
            const li = document.createElement('li');
            const label = document.createElement('label');
            
            const input = document.createElement('input');
            input.type = item.isMulti ? 'checkbox' : 'radio';
            input.name = `question${index}`;
            input.value = key;
            input.id = `q${index}_${key}`;

            // --- INSTANT EVALUATION LOGIC ---
            input.addEventListener('change', () => {
                const inputs = document.querySelectorAll(`input[name="question${index}"]:checked`);
                const selectedAnswers = Array.from(inputs).map(i => i.value).sort();
                const correctAnswers = [...item.ans].sort();
                
                const feedbackBlock = document.getElementById(`feedback-${index}`);
                feedbackBlock.style.display = 'block';

                const isCorrect = JSON.stringify(selectedAnswers) === JSON.stringify(correctAnswers);

                if (isCorrect) {
                    feedbackBlock.className = 'feedback correct';
                    feedbackBlock.innerText = 'Correct! The answer is: ' + item.ans.join(', ').toUpperCase();
                } else {
                    feedbackBlock.className = 'feedback incorrect';
                    feedbackBlock.innerText = 'Incorrect. The correct answer is: ' + item.ans.join(', ').toUpperCase();
                }
            });

            label.appendChild(input);
            label.appendChild(document.createTextNode(` ${key}) ${value}`));
            li.appendChild(label);
            optionsList.appendChild(li);
        }

        const feedbackBlock = document.createElement('div');
        feedbackBlock.className = 'feedback';
        feedbackBlock.id = `feedback-${index}`;

        questionBlock.appendChild(optionsList);
        questionBlock.appendChild(feedbackBlock);
        container.appendChild(questionBlock);
    });

    // --- FINAL SCORE CALCULATOR ---
    function calculateFinalScore() {
        let score = 0;

        quizData.forEach((item, index) => {
            const inputs = document.querySelectorAll(`input[name="question${index}"]:checked`);
            const selectedAnswers = Array.from(inputs).map(input => input.value).sort();
            const correctAnswers = [...item.ans].sort();
            
            if (JSON.stringify(selectedAnswers) === JSON.stringify(correctAnswers)) {
                score++;
            }
        });

        const scoreDisplay = document.getElementById('score-display');
        scoreDisplay.style.display = 'block';
        scoreDisplay.innerText = `Final Score: ${score} out of ${quizData.length}!`;
        
        // Scroll to the bottom to see the score
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
